name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # svelte-kit sync generates route types, which tsc needs.
      - run: bun run check
      - run: bun run typecheck
      - name: Migrations are in sync with the Drizzle schema
        # A schema edit without `bun run db:generate` would ship a database that
        # differs from the code. drizzle-kit only reads the config's URL here.
        run: |
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::src/lib/server/db/schema.ts changed without a migration. Run: bun run db:generate"
            exit 1
          fi
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Tests (against the Postgres service)
        run: bun test --timeout 20000
      - name: Production build
        run: bun run build
      # The production build in Chromium, with passkeys from its virtual
      # authenticator, against its own database on the same service.
      - name: Install Chromium for the end-to-end tests
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests
        run: bunx playwright test
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      # Phase 8 adds the Railway deploy job.
